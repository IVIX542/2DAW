spring.application.name=blogv2

# ===============================
# Configuración de la base de datos
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/blogv2
spring.datasource.username=blogv2
spring.datasource.password=blog
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================

# 
spring.jpa.hibernate.ddl-auto=create

# Muestra qué ejecuta la BBDD
spring.jpa.show-sql=true

# Dialecto de sql utilizado
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Formato de salida legible
spring.jpa.properties.hibernate.format_sql=true
