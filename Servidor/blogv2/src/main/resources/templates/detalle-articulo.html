<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Mi blog</title>
</head>
<body>
    <div th:replace="~{fragmentos/cabecera :: barra_nav}"></div>
    <div class="row text-center mt-5">
        <h1 class="display-6">Detalle de articulo</h1>
    </div>
    <div class="row mt-3">
        <div class="col-3"></div>
        <div class="col-6">
            <div class="card">
                <div class="card-header">
                    <p class="display-6 text-center" th:text="${articulo.titulo}"></p>
                </div>
                <div class="card-body">
                    <p th:text="${articulo.contenido}"> </p>
                </div>
                <div class="card-footer">
                    <p th:text="${articulo.autor}"> </p>
                    <p th:text="${articulo.fechaPublicacion}"> </p>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-4 text-center">
                    <a th:href="@{/articulos}" class="btn btn-secondary">Volver</a>
                </div>
                <div class="col-4 text-center">
                    <a th:href="@{/articulos/editar/{id}(id=${articulo.id})}" class="btn btn-secondary">Modificar</a>
                </div>
                <div class="col-4 text-center">
                    <a th:href="@{/articulos/eliminar/{id}(id=${articulo.id})}" class="btn btn-secondary">Eliminar</a>
                </div>
            </div>
        </div>
        <div class="col-3"></div>
    </div>
    <div th:replace="~{fragmentos/cabecera :: pie_pagina}"></div>
</body>
</html>
