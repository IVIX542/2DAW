<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Mi blog</title>
</head>
<body>
    <div th:replace="~{fragmentos/cabecera :: barra_nav}"></div>
    <div class="row text-center mt-5">
        <h1 class="display-6">Crear articulo</h1>
    </div>
    <div class="row mt-3">
        <div class="col-3"></div>
        <div class="col-6">
            <form th:action="@{/articulos/guardar}" th:object="${articulo}" method="post">

                <!-- atributo oculto con el id, si está creando un articulo no tiene-->
                <input type="hidden" th:field="*{id}">

                <!-- Titulo -->
                 <div class="mt-2">
                    <label for="titulo" class="form-label">Título:</label>
                    <input type="text" id="titulo" th:field="*{titulo}" class="form-control" required maxlength="200">
                 </div>

                <!-- Contenido -->
                 <div class="mt-2">
                    <label for="contenido" class="form-label">Contenido:</label>
                    <textarea id="contenido" th:field="*{contenido}" class="form-control" rows="6" required></textarea>
                 </div>

                <!-- Autor -->
                 <div class="mt-2">
                    <label for="autor" class="form-label">Autor:</label>
                    <input type="text" id="autor" th:field="*{autor}" class="form-control" required maxlength="100">
                 </div>

                <!-- Fecha de publicacion -->
                 <div class="mt-2">
                    <label for="fechaPublicacion" class="form-label">Fecha de publicación:</label>
                    <input type="date" id="fechaPublicacion" th:field="*{fechaPublicacion}" class="form-control" required>
                 </div>
                
                <!-- Publicado -->
                 <div class="mt-2">
                    <input type="checkbox" id="publicado" th:field="*{publicado}" class="form-check-input" >
                    <label for="publicado" class="form-check-label">Publicado</label>
                 </div>
                 

                <div class="d-flex justify-content-between mt-3">
                    <a th:href="@{/articulos}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>

        </div>
        <div class="col-3"></div>
    </div>
    <div th:replace="~{fragmentos/cabecera :: pie_pagina}"></div>
</body>
</html>
