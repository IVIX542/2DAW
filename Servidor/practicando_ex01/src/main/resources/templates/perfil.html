<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
</head>
<body>
    <h1>Perfil</h1>

    <p th:text="${usuario}">Nombre de Usuario</p>
    <p th:text="|Saldo: ${saldo}|">Saldo del Usuario</p>
    <p th:if="${esVip}">Cliente VIP</p>

    <h3>Aficiones:</h3>
    <ul>
        <li th:each="aficion : ${aficiones}" th:text="${aficion}"></li>
    </ul>
</body>
</html>
