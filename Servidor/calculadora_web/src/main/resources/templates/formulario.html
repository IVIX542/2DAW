<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <h1>Calculadora Web</h1>

    <form action="/resultado">
        <label for="num1">Número 1: </label>
        <!-- step="any" permite al usuario meter decimales -->
        <input type="number" step="any" name="num1" id="num1"> 

        <br><br>

        <label for="num2">Número 2: </label>
        <!-- step="any" permite al usuario meter decimales -->
        <input type="number" step="any" name="num2" id="num2">

        <br><br>

        <label for="operacion">Operación (suma, resta, mult, div): </label>
        <select name="operacion" id="operacion">
            <option value="suma">Sumar</option>
            <option value="resta">Restar</option>
            <option value="mult">Multiplicar</option>
            <option value="div">Dividir</option>
        </select>

        <br><br>

        <input type="submit" value="Calcular">
    </form>
</body>
</html>
