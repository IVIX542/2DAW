<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Listado Socios</title>
</head>
<body>
    <div th:replace="~{fragments/fragmentos :: barra_nav}"></div>
    <div class="row text-center mt-5">
        <h1 class="display-6">Listado de Socios</h1>
    </div>
    <div class="row mt-3">
        <div class="col-12">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Cuota Pagada</th>
                        <th>Fecha de Alta</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="socio :${listaSocios}">
                        <td th:text="${socio.nombre} + ' ' + ${socio.apellidos} ">Nombre</td>
                        <td th:text="${socio.cuotaPagada ? 'Sí' : 'No'}">Cuota</td>
                        <td th:text="${socio.fechaAlta}">Fecha Alta</td>
                        <td>
                            <a th:href="@{/socios/{id}(id=${socio.id})}" class="btn btn-secondary">Detalle</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="col-3"></div>
    </div>
    <div th:replace="~{fragments/fragmentos :: pie_pagina}"></div>
</body>
</html>
