<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Detalle socio</title>
</head>
<body>
    <div th:replace="~{fragments/fragmentos :: barra_nav}"></div>
    
    <div class="row text-center mt-5">
        <h1 class="display-6">Detalle de socio</h1>
    </div>

    <div class="row mt-3">
        <div class="col-3"></div>
        <div class="col-6">
            <div class="card">
                <div class="card-header">
                    <p class="display-6 text-center" th:text="|${socio.nombre} ${socio.apellidos}|">Nombre y apellidos del socio</p>
                </div>
                <div class="card-body">
                    <p th:text="|Teléfono: ${socio.telefono}|">Telefono del socio</p>
                    <p th:text="|Teléfono: ${socio.telefono}|">Telefono del socio</p>
                    
                </div>
                <div class="card-footer">
                    <p th:text="|DNI: ${socio.dni}|">DNI del socio</p>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/fragmentos :: pie_pagina}"></div>
</body>
</html>
