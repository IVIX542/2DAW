<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <li>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/ejercicio1}">Ejercicio 1</a>
        <a th:href="@{/ejercicio3}">Ejercicio 3</a>
        <a th:href="@{/ejercicio4}">Ejercicio 4</a>
        <a th:href="@{/ejercicio5}">Ejercicio 5</a>
    </li>
    <h1>Ejercicio 2 - Mostrar categorías con productos anidados</h1>

    <div th:each="entrada : ${categorias}">

        <h3 th:text="${entrada.key}"></h3>

        <ul th:unless="${#lists.isEmpty(entrada.value)}">

            <li th:each="prod : ${entrada.value}"
                th:text="${prod}"></li>

        </ul>

        <p th:if="${#lists.isEmpty(entrada.value)}">
            No hay productos disponibles.
        </p>
    </div>

</body>
</html>
