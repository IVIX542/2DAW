<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>

    <style>
        table {
            text-align: center;
            border: 1px solid black;
            border-bottom: none;
            border-left: none;
        }
        th {
            border-bottom: 1px dashed black;
            border-left: 1px solid black;
        }
        td {
            border-bottom: 1px solid black;
            border-left: 1px solid black;
        }
        .oferta {
            background-color: green;
        }
        .premium {
            background-color: gold;
        }
        .agotado {
            background-color: red;
        }
    </style>
</head>
<body>
    <li>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/ejercicio1}">Ejercicio 1</a>
        <a th:href="@{/ejercicio2}">Ejercicio 2</a>
        <a th:href="@{/ejercicio3}">Ejercicio 3</a>
        <a th:href="@{/ejercicio5}">Ejercicio 5</a>
    </li>
    <h1>Ejercicio 4</h1>

    <table>
        <thead>
            <th th:each="e : ${encabezados}"
                th:text="${e}"></th>
        </thead>

        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.nombre}">Nombre</td>
                <td th:text="${p.precio} + ' €'">Precio</td>
                <td th:if="${p.precio < 10}"
                    th:classappend="oferta">
                    Oferta
                </td>
                <td th:if="${p.precio > 1000}"
                    th:classappend="premium">
                    Premium
                </td>
                <td th:if="${p.stock == 0}"
                    th:classappend="agotado">
                    Agotado
                </td>

            </tr>
        </tbody>
    </table>
</body>
</html>
