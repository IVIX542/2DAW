<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragmentos</title>

</head>
<body>
    <div th:fragment="cabecera(cliente)"
          th:switch="${cliente.rol}">

        <div case="'ADMIN'">
            <a th:href="@{/}">
                Inicio
            </a>
            <a th:href="@{/pedidos}">
                Pedidos
            </a>
            <a href="#">
                Consultas
            </a>
            <a href="#">
                Cerrar sesion
            </a>
        </div>
        <ul th:case="'USER'">
            <p>Usuario</p>
            <li>
                <a th:href="@{/}">Inicio</a>
            </li>
            <li>
                <a th:href="@{/pedidos}">Pedidos</a>
            </li>
            <li>
                <a href="#">Mi perfil</a>
            </li>
            <li>
                <a href="#">Cerrar sesion</a>
            </li>
        </ul>
        <ul th:case="'INVITADO'">
            <p>Invitado</p>
            <li>
                <a th:href="@{/}">Inicio</a>
            </li>
            <li>
                <a th:href="@{/pedidos}">Pedidos</a>
            </li>
            <li>
                <a href="#">Iniciar sesion</a>
            </li>
        </ul>
    </div>

    <div th:fragment="pedidoPendiente(pedido)">
        <h3 th:text="${pedido.nombre}"
            style="background-color: orange;">
            Nombre del Pedido
        </h3>
    </div>
</body>
</html>
