<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragmentos</title>

</head>
<body>

    <!-- Cabecera -->
    <header th:fragment="cabecera(cliente)">
        <nav>
            <div th:switch="${cliente.rol}">
                <!-- Opciones para ADMIN -->
                <ul th:case="'ADMIN'">
                    <li><a href="/admin/gestion">Gestión</a></li>
                </ul>
                <!-- Opciones para USER -->
                <ul th:case="'USER'">
                    <li><a href="/user/perfil">Perfil</a></li>
                </ul>
                <!-- Opciones para INVITADO -->
                <ul th:case="'INVITADO'">
                    <li><a href="/login">Iniciar sesión</a></li>
                </ul>
                <!-- Opción por defecto -->
                <ul th:case="*">
                    <li><a href="/">Inicio</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Tipos de pedidos -->
    <div th:fragment="pedidoPendiente(pedido)"
        style="background-color: lightcoral;
               border: 5px solid black;
               padding: 1%;
               margin: 1vh 0;
               width: fit-content;">
        <h3 th:text="${pedido.nombre}">
            Nombre del Pedido
        </h3>
        <p th:text="|Estado: ${pedido.estado}|">Estado</p>
    </div>

    <div th:fragment="pedidoEnviado(pedido)"
         style="background-color: lightblue;
                border: 5px solid black;
                padding: 1%;
                margin: 1vh 0;
                width: fit-content;">
        <h3 th:text="${pedido.nombre}">
            Nombre del Pedido
        </h3>
        <p th:text="|Estado: ${pedido.estado}|">Estado</p>
    </div>

    <div th:fragment="pedidoEntregado(pedido)"
         style="background-color: lightgreen;
                border: 5px solid black;
                padding: 1%;
                margin: 1vh 0;
                width: fit-content;">
        <h3 th:text="${pedido.nombre}">
            Nombre del Pedido
        </h3>
        <p th:text="|Estado: ${pedido.estado}|">Estado</p>
    </div>
</body>
</html>
