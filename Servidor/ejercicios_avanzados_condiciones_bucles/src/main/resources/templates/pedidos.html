<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <style>
        a {
            text-decoration: none;
            padding-left: 1rem;
        }
        
    </style>
</head>
<body>
    <div th:replace="~{fragmentos/fragments :: cabecera(${cliente1})}">
        <p>Cabecera</p>
    </div>

    <h1>Pedidos</h1>

    <h2 th:text="|Cliente: ${cliente1.nombre}|"></h2>

    <div th:each="pedido : ${cliente1.pedidos}"
         th:switch="${pedido.estado}">

        <div th:case="'pendiente'"
             th:insert="~{fragmentos/fragments :: pedidoPendiente(${pedido})}">
        </div>
        <div th:case="'enviado'"
             th:insert="~{fragmentos/fragments :: pedidoEnviado(${pedido})}">
        </div>
        <div th:case="'entregado'">
            <p th:text="${pedido.nombre}"></p>
        </div>
        

    </div>
</body>
</html>
