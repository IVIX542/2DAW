<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <style>
        a {
            text-decoration: none;
            padding-left: 1rem;
        }
    </style>
</head>
<body th:with="mostrar = ${filtro}, pedidos = ${cliente1.pedidos}">
    <header th:insert="~{fragmentos/fragments :: cabecera(${cliente1})}">
        <p>Cabecera</p>
    </header>

    <h1>Catálogo</h1>

    <ul th:each="pedido : ${pedidos}">
        <li th:if="(${mostrar} == 'oferta' and ${pedido.precioUnitario} < 10.0) or 
                   (${mostrar} == 'caro' and ${pedido.precioUnitario} > 1000.0) or 
                   (${mostrar} == 'todos')">
            <span th:text="${pedido.nombre}">Nombre Producto</span>
            <span th:text="${pedido.precioUnitario} + ' €'">Precio Producto</span>

        </li>
    </ul>

    <p th:if="${#lists.isEmpty(pedidos)}">No hay productos disponibles.</p>
    
</body>
</html>
