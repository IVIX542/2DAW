<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de asignaturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>

    <div class="container mt-5 pt-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="display-6 m-0">Asignaturas</h1>
            <a th:href="@{/asignatura/nueva}" class="btn btn-secondary">Nueva asignatura</a>
        </div>

        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Curso</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="asig : ${listaAsignaturas}" th:if="${asig != null}">
                    <td th:text="${asig.id_asignatura}">1</td>
                    <td th:text="${asig.nombre}">Acceso a Datos</td>
                    <td th:text="${asig.curso}">2º DAW</td>
                    <td>
                        <a th:href="@{/asignatura/editar/{id}(id=${asig.id_asignatura})}"
                           class="btn btn-sm btn-outline-secondary">Editar</a>
                        <a th:href="@{/asignatura/eliminar/{id}(id=${asig.id_asignatura})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Seguro que quieres eliminar esta asignatura?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
