<!DOCTYPE html>
<html lang="es" xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Gestión de alumnos</title>
</head>
<body>
    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>
    <div class="row text-center mt-5">
        <h1 class="display-6">Lista de alumnos</h1>
    </div>
    <div class="row mt-3">
        <div class="col-3"></div>
        <div class="col-6">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="alumno :${listaAlumnos}">
                        <td th:text="${alumno.nombre}"></td>
                        <td th:text="${alumno.apellidos}"></td>
                        <td><a th:href="@{/alumno/{id}(id=${alumno.id_alumno})}" class="btn btn-secondary">Detalle</a></td>
                        <td>
                            <a th:if="${alumno.perfil != null}" 
                               th:href="@{/alumno/perfil/{id}(id=${alumno.id_alumno})}" 
                               class="btn btn-secondary">

                                Perfil
                            </a>
                            <a th:unless="${alumno.perfil != null}"
                                th:href="@{/alumno/perfil/nuevo}"
                                class="btn btn-secondary">

                                Crear Perfil
                            </a>
                        </td>
                        <td><a th:href="@{/alumno/matriculas/{id}(id=${alumno.id_alumno})}" class="btn btn-secondary">Matriculas</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="col-3"></div>
    </div>
</body>
</html>
