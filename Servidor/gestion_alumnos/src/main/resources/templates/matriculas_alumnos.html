<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Perfil de Alumno</title>
</head>
<body>
    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>
    <div class="row text-center mt-5">
        <h1 class="display-6">Matriculas de alumno</h1>
    </div>
    <div class="row mt-3">
        <div class="col-3"></div>
        <div class="col-6">
            <div class="card">
                <div class="card-header">
                    <p th:text="${alumno.nombre}"> </p>
                    <p th:text="${alumno.apellidos}"> </p>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                            <tr><th>Asignatura</th><th>Curso</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="asignatura: ${alumno.asignaturas}">
                                <td>[[${asignatura.nombre}]]</td>
                                <td>[[${asignatura.curso}]]</td>
                                <td>
                                    <a th:href="@{/alumno/matricula/eliminar/{idAlumno}/{idAsignatura}(idAlumno=${alumno.id_alumno}, idAsignatura=${asignatura.id_asignatura})}"
                                        class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('¿Seguro que quieres eliminar esta matrícula?');">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
               
                </div>
            </div>
            <div class="row mt-3">
               
                <div class="col-3 text-center">
                    <a th:href="@{/alumno}" class="btn btn-secondary">Volver</a>
                </div>
            
                <div class="col-3 text-center">
                    <a th:href="@{/alumno/matricula/nueva/{id}(id=${alumno.id_alumno})}" class="btn btn-secondary">Nueva matricula</a>
                </div>
            
            </div>
        </div>
        <div class="col-3"></div>
    </div>
</body>
</html>
