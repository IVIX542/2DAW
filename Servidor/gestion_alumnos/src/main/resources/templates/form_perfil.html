<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- NOTE: Estilos proporcionados por Gemini -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>

    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">

                <!-- Título con el mismo estilo que "Lista de alumnos" -->
                <h1 class="display-6 text-center mb-4">Datos del perfil</h1>

                <form th:action="@{/alumno/perfil/guardar}" th:object="${perfil}" method="post">

                    <!-- Campos ID ocultos para editar -->
                    <input type="hidden" th:field="*{id_perfil}">
                    <input  type="hidden" th:value="${id_alumno}">

                    <!-- Dirección -->
                    <div class="mb-3">
                        <label for="direccion" class="form-label fw-bold">Dirección</label>
                        <input type="text" id="direccion" class="form-control" th:field="*{direccion}" placeholder="Ej. Calle Principal">
                    </div>
                    
                    <!-- Telefono -->
                    <div class="mb-3">
                        <label for="telefono" class="form-label fw-bold">Telefono</label>
                        <input type="text" id="telefono" class="form-control" th:field="*{telefono}" placeholder="Ej. +34 666 666 666">
                    </div>

                    <!-- Foto del perfil -->
                    <div class="mb-3">
                        <label for="foto" class="form-label fw-bold">Foto de Perfil</label>
                        <input type="file" id="foto" class="form-control" th:field="*{foto_url}" disabled>
                        <p class="form-text">La subida de imágenes no está disponible en este momento.</p>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/alumno}" class="btn btn-outline-secondary">Volver</a>
                        <button type="submit" class="btn btn-secondary">Guardar</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</body>
</html>
