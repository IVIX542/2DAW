<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva matrícula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>

    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">

                <h1 class="display-6 text-center mb-4">Nueva matrícula</h1>

                <p class="text-center text-muted mb-4">
                    Alumno: <strong th:text="${alumno.nombre + ' ' + alumno.apellidos}">Alumno</strong>
                </p>

                <form th:action="@{/alumno/matricula/guardar}" method="post">
                    <input type="hidden" name="id_alumno" th:value="${alumno.id_alumno}">

                    <div class="mb-3">
                        <label for="id_asignatura" class="form-label fw-bold">Asignatura</label>
                        <select id="id_asignatura" name="id_asignatura" class="form-select" required>
                            <option value="" disabled selected>Selecciona una asignatura</option>
                            <option th:each="asig : ${listaAsignaturas}"
                                    th:value="${asig.id_asignatura}"
                                    th:text="${asig.nombre + ' (' + asig.curso + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/alumno/matriculas/{id}(id=${alumno.id_alumno})}" class="btn btn-outline-secondary">Volver</a>
                        <button type="submit" class="btn btn-secondary">Matricular</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
