<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Detalle de Alumno</title>
</head>
<body>
    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>
    <div class="row text-center mt-5">
        <h1 class="display-6">Detalle de alumno</h1>
    </div>
    <div class="row mt-3">
        <div class="col-3"></div>
        <div class="col-6">
            <div class="card">
                <div class="card-header">
                    <p th:text="${alumno.nombre}"> </p>
                    <p th:text="${alumno.apellidos}"> </p>
                </div>
                <div class="card-body">
                    <p class="display-6 text-center">Notas</p>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Asignatura</th>
                                <th>Calificacion</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="nota :${alumno.notas}">
                                <td th:text="${nota.asignatura}"></td>
                                <td th:text="${nota.calificacion}"></td>
                            </tr>
                        </tbody>
                    </table>     
                </div>
                <div class="card-footer">
               
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-3 text-center">
                    <a th:href="@{/alumno}" class="btn btn-secondary">Volver</a>
                </div>
                <div class="col-3 text-center">
                    <a th:href="@{/alumno/editar/{id}(id=${alumno.id_alumno})}" class="btn btn-secondary">Modificar</a>
                </div>
                <div class="col-3 text-center">
                    <a th:href="@{/alumno/eliminar/{id}(id=${alumno.id_alumno})}" class="btn btn-secondary">Eliminar</a>
                </div>
                <div class="col-3 text-center">
                    <a th:href="@{/nota/nueva/{id}(id=${alumno.id_alumno})}" class="btn btn-secondary">Nueva nota</a>
                </div>
            </div>
        </div>
        <div class="col-3"></div>
    </div>
</body>
</html>
