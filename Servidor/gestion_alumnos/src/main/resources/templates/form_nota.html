<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario nota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>

    <div class="container mt-5 pt-3">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">

                <h1 class="display-6 text-center mb-4">Datos de la nota</h1>

                <form th:action="@{/nota/guardar}" th:object="${nota}" method="post">

                    <input type="hidden" th:field="*{id_nota}">
                    <input type="hidden" name="id_alumno" th:value="${id_alumno}">

                    <div class="mb-3">
                        <label for="asignatura" class="form-label fw-bold">Asignatura</label>
                        <input type="text" id="asignatura" class="form-control" th:field="*{asignatura}" placeholder="Ej. Servidor" required>
                    </div>

                    <div class="mb-3">
                        <label for="calificacion" class="form-label fw-bold">Calificación</label>
                        <input type="number" id="calificacion" class="form-control" th:field="*{calificacion}" step="0.1" min="0" max="10" required>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/alumno/{id}(id=${id_alumno})}" class="btn btn-outline-secondary">Volver</a>
                        <button type="submit" class="btn btn-secondary">Guardar</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</body>
</html>
