<!DOCTYPE html>
<html lang="en" xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Crear una nota</title>
</head>
<body>
    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>
    <div class="row text-center mt-5">
        <h1 class="display-6">Matricular alumno</h1>
    </div>
    <div class="row mt-3">
        <div class="col-3"></div>
        <div class="col-6">
            <form th:action="@{/alumno/guardar/matricula/{id}(id=${alumno.id_alumno})}" th:object="${nota}" method="post">

                <!-- listado de asignaturas -->
                <div th:each="asig:${listaAsignaturas}">
                    <input type="radio" name="asignatura" th:value="${asig.id_asignatura}">
                    <label>[[${asig.nombre}]] ([[${asig.curso}]])</label>
                </div>

                <div class="d-flex justify-content-between mt-3">
                    <a th:href="@{/alumno}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>

        </div>
        <div class="col-3"></div>
    </div>
</body>
</html>
