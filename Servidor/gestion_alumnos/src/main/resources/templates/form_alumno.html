<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- NOTE: Estilos proporcionados por Gemini -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div th:replace="~{fragmentos/fragmento :: barra_nav}"></div>

    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">

                <!-- Título con el mismo estilo que "Lista de alumnos" -->
                <h1 class="display-6 text-center mb-4">Datos del alumno</h1>

                <form th:action="@{/alumno/guardar}" th:object="${alumno}" method="post">

                    <!-- Campo ID oculto para editar -->
                    <input type="hidden" th:field="*{id_alumno}">

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre</label>
                        <input type="text" id="nombre" class="form-control" th:field="*{nombre}" placeholder="Ej. Iván" required>
                    </div>
                    
                    <!-- Apellidos -->
                    <div class="mb-3">
                        <label for="apellidos" class="form-label fw-bold">Apellidos</label>
                        <input type="text" id="apellidos" class="form-control" th:field="*{apellidos}" placeholder="Ej. López Benítez" required>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/alumno}" class="btn btn-outline-secondary">Volver</a>
                        <button type="submit" class="btn btn-secondary">Guardar</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</body>
</html>
