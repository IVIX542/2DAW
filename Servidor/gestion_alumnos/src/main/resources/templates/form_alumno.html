<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">

                    <!-- Título -->
                    <div class="card-header bg-primary text-white text-center">
                        <h5 class="mb-0">Datos del Alumno</h5>
                    </div>

                    <!-- Cuerpo del formulario -->
                    <div class="card-body">
                        <form th:action="@{/guardar}" th:object="${alumno}" method="post">

                            <!-- Campo ID oculto para editar -->
                            <input type="hidden" th:field="*{id_alumno}">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" id="nombre" class="form-control" th:field="*{nombre}" placeholder="Ej. Iván" required>
                            </div>
                            
                            <!-- Apellidos -->
                            <div class="mb-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" id="apellidos" class="form-control" th:field="*{apellidos}" placeholder="Ej. López Benítez" required>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex justify-content-between mt4">
                                <a th:href="@{/alumno}" class="btn btn-secondary">Volver</a>

                                <button type="submit" class="btn btn-success">Guardar</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
