<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <h1>
        Ejercicio 3. Precio de una Compra con Descuento
    </h1>

    <p th:text="|Precio: ${precio}|"></p>
    <p th:text="|Cantidad: ${cantidad}|"></p>
    <p th:text="|Descuento: ${descuento}|"></p>
    <br>
    <!-- Utilizar concatenación para cálculos complejos -->
    <p th:text="'Precio total: ' + ${precio} * ${cantidad}"></p>
    <p th:text="'Precio Final: ' + ((${precio} * ${cantidad}) - ${descuento})"></p>
    <br>
    <p th:text="'¿Precio final mayor que 30€?: ' + (((${precio} * ${cantidad}) - ${descuento}) > 30)"></p>
    <p th:text="'¿Precio final menor que 50€?: ' + (((${precio} * ${cantidad}) - ${descuento}) < 50)"></p>

</body>
</html>
