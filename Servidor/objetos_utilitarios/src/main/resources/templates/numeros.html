<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeros</title>
</head>
<body>
    <h1>Números</h1>
    <p th:text="'Número: ' + ${numero}"></p>
    <p th:text="'Número: ' + ${#numbers.formatDecimal(numero, 1, 2)}"></p>
    <p th:text="'Número: ' + ${#numbers.formatCurrency(numero)}"></p>
    <p th:text="'Número: ' + ${#numbers.formatPercent(numero, 5, 2)}"></p>
</body>
</html>
