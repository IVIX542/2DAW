<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilitarios</title>
</head>
<body>
    <h1>Objetos Utilitarios</h1>
    <p th:text="${#temporals.format(fecha, 'dd/MMMM/yyyy - HH:mm')}"></p>

    <!-- Nombre del mes -->
    <p th:text="'Nombre del mes: ' + ${#temporals.monthName(fecha)}"></p>

    <!-- Nombre del día de la semana -->
    <p th:text="'Nombre del día: ' + ${#temporals.dayOfWeekName(fecha)}"></p>
    <p th:text="'Ahora: ' + ${#temporabout:blank#blockedals.format(#temporals.createNow(), 'dd/MMMM/yyyy - HH:mm:ss')}"></p>
</body>
</html>
