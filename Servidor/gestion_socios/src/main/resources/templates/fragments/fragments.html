<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Gestión de socios</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <nav th:fragment="barra_nav" class="bg-slate-900 text-white shadow-lg">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-6 py-4">
            <a class="text-xl font-bold tracking-wide" th:href="@{/socio/inicio}">Club de socios</a>
            <div class="flex flex-wrap gap-2 text-sm font-medium">
                <a class="rounded-lg px-3 py-2 hover:bg-slate-700" th:href="@{/socio}">Socios</a>
                <a class="rounded-lg px-3 py-2 hover:bg-slate-700" th:href="@{/cuota}">Cuotas</a>
                <a class="rounded-lg px-3 py-2 hover:bg-slate-700" th:href="@{/carnet/nuevo}">Carnets</a>
                <a class="rounded-lg px-3 py-2 hover:bg-slate-700" th:href="@{/actividad}">Actividades</a>
            </div>
        </div>
    </nav>
    <footer th:fragment="pie_pagina" class="mt-12 border-t border-slate-200 bg-white">
        <div class="mx-auto max-w-7xl px-6 py-5 text-sm text-slate-500">
            Gestión de socios del club
        </div>
    </footer>
</body>
</html>
