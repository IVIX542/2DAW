<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Actividades')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <div th:replace="~{fragments/fragments :: barra_nav}"></div>
    <main class="mx-auto max-w-7xl px-6 py-10">
        <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
            <div>
                <p class="text-sm font-semibold uppercase tracking-wider text-blue-700">Club</p>
                <h1 class="mt-1 text-3xl font-bold">Actividades</h1>
            </div>
            <a class="rounded-xl bg-blue-700 px-5 py-3 font-semibold text-white shadow hover:bg-blue-800"
               th:href="@{/actividad/nuevo}">Nueva actividad</a>
        </div>

        <p th:if="${param.error != null}"
           class="mb-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-red-800">
            No se puede eliminar una actividad con socios inscritos.
        </p>

        <div class="grid gap-6 lg:grid-cols-2">
            <section th:each="actividad : ${actividades}"
                     class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
                <div class="flex flex-wrap items-start justify-between gap-3">
                    <div>
                        <h2 class="text-xl font-bold" th:text="${actividad.nombre}"></h2>
                        <p class="mt-2 text-slate-600"
                           th:text="${actividad.descripcion ?: 'Sin descripción'}"></p>
                    </div>
                    <div class="flex gap-2">
                        <a class="rounded-lg bg-blue-50 px-3 py-2 text-sm font-semibold text-blue-800 hover:bg-blue-100"
                           th:href="@{/actividad/editar/{id}(id=${actividad.id})}">Editar</a>
                        <form th:action="@{/actividad/eliminar/{id}(id=${actividad.id})}" method="post">
                            <button class="rounded-lg bg-red-50 px-3 py-2 text-sm font-semibold text-red-700 hover:bg-red-100"
                                    type="submit">Eliminar</button>
                        </form>
                    </div>
                </div>

                <div class="mt-6 border-t border-slate-100 pt-5">
                    <h3 class="font-semibold">Participantes</h3>
                    <p th:if="${actividad.socios.isEmpty()}" class="mt-2 text-sm text-slate-500">
                        Sin socios inscritos.
                    </p>
                    <ul class="mt-3 space-y-2">
                        <li th:each="socio : ${actividad.socios}"
                            class="flex items-center justify-between gap-3 rounded-xl bg-slate-50 px-4 py-3">
                            <span class="font-medium"
                                  th:text="${socio.nombre + ' ' + socio.apellidos}"></span>
                            <form th:action="@{/actividad/retirar/{a}/{s}(a=${actividad.id},s=${socio.id})}"
                                  method="post">
                                <button class="text-sm font-semibold text-red-700 hover:text-red-900"
                                        type="submit">Retirar</button>
                            </form>
                        </li>
                    </ul>

                    <form class="mt-4 flex flex-wrap gap-2"
                          th:action="@{/actividad/inscribir/{id}(id=${actividad.id})}" method="post">
                        <select class="min-w-0 flex-1 rounded-xl border border-slate-300 bg-white px-4 py-3"
                                name="socioId" required>
                            <option value="" selected disabled>Selecciona un socio</option>
                            <option th:each="socio : ${socios}" th:value="${socio.id}"
                                    th:text="${socio.nombre + ' ' + socio.apellidos}"></option>
                        </select>
                        <button class="rounded-xl bg-slate-800 px-4 py-3 font-semibold text-white hover:bg-slate-700"
                                type="submit">Inscribir</button>
                    </form>
                </div>
            </section>
        </div>

        <p th:if="${actividades.isEmpty()}"
           class="rounded-2xl bg-white p-10 text-center text-slate-500 shadow-sm ring-1 ring-slate-200">
            Todavía no hay actividades registradas.
        </p>
    </main>
    <div th:replace="~{fragments/fragments :: pie_pagina}"></div>
</body>
</html>
