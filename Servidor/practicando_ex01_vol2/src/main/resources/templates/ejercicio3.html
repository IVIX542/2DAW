<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 3</title>
</head>
<body>
    <h1>Bloque 3: Condicionales complejos y bucles</h1>

    <ul>
        <li th:each="tarea : ${tareas}"
             th:unless="${tarea.completada}">
             <span th:text="${tarea.titulo}">Título de la tarea</span>
            <th:block th:switch="${tarea.prioridad}">
                <span th:case="'ALTA'">PRIORIDAD ALTA</span>
                <span th:case="'MEDIA'">PRIORIDAD MEDIA</span>
                <span th:case="'BAJA'">PRIORIDAD BAJA</span>
            </th:block>
        </li>
    </ul>

</body>
</html>
