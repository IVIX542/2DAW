<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 4</title>
</head>
<body>
    <h1>Utilitarios de Cadenas y Colecciones</h1>

    <p th:text="${#strings.length(descripcion)}">Longitud de descripción</p>

</body>
</html>
