<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>Dashboard</h1>

    <!-- Bloque 2 -->
    <ul>
        <li th:each="entrada, posicion : ${empleadosRoles}">
            <span th:text="${posicion.count}">Posición</span>
            <span th:text="${entrada.key}">Clave</span> : 
            <span th:text="${entrada.value}">Valor</span>
        </li>
    </ul>
</body>
</html>
