<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicios Objetos Nativos y del Navegador</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/ejercicios.js" defer></script>
</head>
<body>
	<div>
		<h1 class="text-center text-4xl font-bold font-serif">
			Ejercicios con Objetos Nativos y del Navegador
		</h1>
	</div>
	<div class="flex gap-4 m-2">
	  <button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="location.reload()">Recargar Página</button>
	  <button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="ejercicioString()">String</button>
	  <button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="ejercicioNumber()">Number</button>
	  <button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="ejercicioMath()">Math</button>
	  <button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="ejercicioDate()">Date</button>
	</div>
	<hr>
	<div class="flex gap-4 m-2">
		<button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="mostrarNombre()">Nombre del Usuario</button>
		<button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="cambiarColor()">Cambiar Fondo</button>
		<button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="mostrarTamaño()">Tamaño Ventana</button>
		<button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="mostrarURL()">Mostrar URL</button>
		<button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="comprobarConexion()">Conexión</button>
		<button class="flex-1 bg-red-200 p-2 rounded-lg" onclick="volverAtras()">Volver Atrás</button>
	</div>
	<hr>  
</body>
</html>
