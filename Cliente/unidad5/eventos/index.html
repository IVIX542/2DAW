<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Eventos de navegadores</title>
    <!-- Usamos defer para que el script se cargue después de que cargue la página -->
	<script src="js/eventos.js" defer></script>
</head>
<body>
    <!-- asocio al elemento una función js con un atributo on<nombre-evento> -->
	<button onclick="saludar()">Haz clic</button>

	<button ondblclick="saludar()">Haz doble clic</button>

	<button onmouseenter="saludar()">Entra</button>
    
    <button id="boton-con-AEL">Haz click con AddEventListener</button>

    <button id="boton-con-info-evento">Haz clic con información del evento</button>

    <div>
        <hr>
        <h1 id="cabecera">Esto es un h1</h1>
        <hr>
        <p onmouseenter="saludar()">Esto es un parrafo</p>
        <hr>
    </div>

    <hr>

    <form id="formulario">
        <label for="dato1">Datos</label>
        <input type="text" name="dato1" id="dato1">
        <br>
        <button id="enviar">Enviar</button>
    </form>
    <p id="salida"></p>
</body>
</html>
