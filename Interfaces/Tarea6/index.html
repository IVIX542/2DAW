<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Inscripción Aula Abierta</title>
</head>
<body>
    <main>

        <div class="cabecera">

            <img src="img/documento.svg" alt="imagen documento">

            <h1>Configura tu Inscripción</h1>
            <p>Completa tus preferencias para el curso</p>

        </div>

        <form class="formulario">

            <div class="datos-basicos seccion">
                <div class="titulo">
                    <img src="img/usuarios.svg" alt="imagen usuarios">
                    <h3>Datos Básicos</h3>
                </div>

                <div class="nombre campo">
                    <label for="txt-nombre">Nombre</label>
                    <input type="text" placeholder="Ej.: Ana García" name="nombre" id="txt-nombre">
                </div>

                <div class="correo campo">

                    <div class="titulo">
                        <img src="img/correo.svg" alt="imagen correo">
                        <h3>Correo Electrónico</h3>
                    </div>

                    <input type="email" placeholder="ana@aula.es" id="in-correo">

                </div>

                <div class="curso campo">

                    <label for="txt-curso">Curso que buscas</label>
                    <input type="text" name="curso" list="lista-cursos" placeholder="Ej.: CSS" id="txt-curso">

                    <datalist id="lista-cursos">
                        <option value="HTML">
                        <option value="CSS">
                        <option value="JavaScript">
                        <option value="PHP">
                    </datalist>

                </div>

                <div class="sesiones campo">
                    
                    <label for="num-sesiones">Sesiones Semanales</label>
                    <input type="number" name="sesiones-semanales" min="1" max="5" value="1" id="num-sesiones">

                </div>

            </div>

            <div class="preferencias seccion">

                <div class="titulo">
                    <img src="img/sol.svg" alt="imagen usuarios">
                    <h3>Preferencias</h3>
                </div>

                <div class="fecha-inicio campo">
                    <div class="titulo">
                        <img src="img/calendario.svg" alt="imagen correo">
                        <h3>Fecha de inicio preferida</h3>
                    </div>

                    <input type="date" id="in-fecha">
                </div>

                <div class="color-preferido campo">
                    <div class="titulo">
                        <img src="img/paleta.svg" alt="imagen usuarios">
                        <h3>Color Preferido</h3>
                    </div>

                    <input type="color" value="#7339e8" id="color-elegido">
                </div>

                <div class="nivel-intensidad campo">
                    <label for="slide-intensidad">Nivel de intensidad</label>
                    <input type="range" id="slide-intensidad" min="0" max="100" step="1" value="50">
                </div>

            </div>

            <div class="opciones seccion">
                <div class="titulo">
                    <h3>Opciones</h3>
                </div>

                <div class="casilla">
                    <input type="checkbox" name="nuevas-ediciones" checked="true" id="cb-nuevas-ediciones">
                    <label for="cb-nuevas-ediciones">Recibir avisos de nuevas ediciones</label>
                </div>
                
                <div class="casilla">
                    <input type="checkbox" name="material-complementario" id="cb-material-complementario">
                    <label for="cb-material-complementario">Recibir material complementario</label>
                </div>
            </div>

            <div class="modalidad seccion">

                <div class="titulo">
                    <img src="img/gafas.svg" alt="imagen usuarios">
                    <h3>Modalidad</h3>
                </div>

                <div class="opciones-modalidad">

                    <div class="opcion">
                        <input type="radio" name="opcion" value="presencial" id="op-presencial">
                        <label for="op-presencial">Presencial</label>
                    </div>

                    <div class="opcion">
                        <input type="radio" name="opcion" checked="true" value="online" id="op-online">
                        <label for="op-online">Online</label>
                    </div>

                    <div class="opcion">
                        <input type="radio" name="opcion" value="hibrida" id="op-hibrida">
                        <label for="op-hibrida">Híbrida</label>
                    </div>

                </div>

            </div>

            <div class="estado-inscripcion seccion">
                <div class="titulo">
                    <h3>Estado de la inscripción</h3>
                </div>

                <div class="codigo-promocional campo">

                    <label for="in-codigo-promocional">Código Promocional</label>
                    <input type="text" disabled placeholder="NO DISPONIBLE" name="codigo-promocional" id="in-codigo-promocional">
                    <p class="nota-input">El código promocional no está disponible para esta edición</p>
                    
                </div>
            </div>

            <div class="guardar-inscripcion seccion">
                <input type="button" value="Guardar Inscripción">
            </div>

        </form>

    </main>
</body>
</html>
