<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz con grid y flexbox</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabecera -->
    <div class="cabecera">
        <div class="logo">
            LOGO
        </div>

        <div class="titulo">
            TÍTULO
        </div>

        <div class="usuario">
            USUARIO
        </div>
    </div>

    <!-- Navegación -->
    <div class="navegacion">
        <div>OPCIÓN 1</div>
        <div>OPCIÓN 2</div>
        <div>OPCIÓN 3</div>
        <div>OPCIÓN 4</div>
        <div>OPCIÓN 5</div>
    </div>

    <!-- Principal -->
    <div class="principal">
        <div class="destacado">DESTACADO</div>

        <div class="rejilla">
            <div class="elemento1">ELEMENTO1</div>
            <div class="elemento2">ELEMENTO2</div>
            <div class="elemento3">
                ELEMENTO3
                <div class="accion1">ACCIÓN 1</div>
                <div class="accion2">ACCIÓN 2</div>
            </div>
            <div class="elemento4">ELEMENTO4</div>
            <div class="elemento5">ELEMENTO5</div>
            <div class="elemento6">ELEMENTO6</div>
        </div>

        <div class="asimetrico">
            <div class="elementoA">ELEMENTO A</div>
            <div class="elementoB">ELEMENTO B</div>
            <div class="elementoC">ELEMENTO C</div>
        </div>
    </div>

    <!-- Lateral -->
    <div class="lateral">

    </div>

    <!-- Pie de página -->
    <div class="pie">
    
    </div>

</body>
</html>
